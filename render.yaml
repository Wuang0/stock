services:
  # 后端 API — Python Web Service
  - type: web
    name: stock-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_BASE
        value: https://open.bigmodel.cn/api/paas/v4
      - key: LLM_MODEL
        value: glm-4.7
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

  # 前端 — Static Site
  - type: web
    name: stock-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://stock-ai-backend.onrender.com/api

  # 展示页 — Static Site
  - type: web
    name: stock-ai-showcase
    runtime: static
    rootDir: showcase
    staticPublishPath: .
